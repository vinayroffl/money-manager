name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        env:
          # Test-only value. The test profile provides its own default, but this
          # keeps any placeholder resolution from failing in CI.
          JWT_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
        run: ./mvnw -B -ntp verify

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        env:
          VITE_API_BASE_URL: http://localhost:8080
        run: npm run build

  docker:
    name: Backend image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: money_manager_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          load: true
          tags: money-manager-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test image
        run: docker run --rm --entrypoint java money-manager-backend:ci -version

      - name: Start backend and check health
        run: |
          docker run -d --name money-manager-smoke \
            --network host \
            -e SPRING_PROFILES_ACTIVE=prod \
            -e DB_URL=jdbc:postgresql://localhost:5432/money_manager_ci \
            -e DB_USERNAME=postgres \
            -e DB_PASSWORD=postgres \
            -e JWT_SECRET=ci-only-secret-0123456789abcdef0123456789abcdef \
            money-manager-backend:ci

          for _ in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/actuator/health -o /tmp/health.json; then
              cat /tmp/health.json
              grep -q '"status":"UP"' /tmp/health.json && exit 0
            fi
            sleep 2
          done

          echo "Backend did not become healthy"
          docker logs money-manager-smoke
          exit 1

      - name: Stop backend
        if: always()
        run: docker rm -f money-manager-smoke || true

  migrations:
    name: Database migrations (PostgreSQL 15)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: money_manager_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply Flyway migrations
        run: |
          docker run --rm --network host \
            -v "$PWD/backend/src/main/resources/db/migration:/flyway/sql:ro" \
            flyway/flyway:11.20.3 \
            -url=jdbc:postgresql://localhost:5432/money_manager_ci \
            -user=postgres \
            -password=postgres \
            -locations=filesystem:/flyway/sql \
            -baselineOnMigrate=false \
            migrate

      - name: Verify migration state
        run: |
          version="$(docker run --rm --network host \
            -e PGPASSWORD=postgres \
            postgres:15 \
            psql -h localhost -U postgres -d money_manager_ci \
            -tAc "select version from flyway_schema_history where success order by installed_rank desc limit 1")"
          echo "Current schema version: ${version}"
          test "${version}" = "2"
