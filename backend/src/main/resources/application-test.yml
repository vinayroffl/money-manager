spring:
  datasource:
    # Testcontainers starts a PostgreSQL 15 container on first use and reuses it
    # for the rest of the JVM. Docker must be running.
    url: jdbc:tc:postgresql:15:///money_manager
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    username: test
    password: test

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create-drop

  # Migrations target PostgreSQL and are verified in the dedicated CI job.
  flyway:
    enabled: false

jwt:
  # Test-only signing key. Never use this outside the test profile.
  secret: ${JWT_SECRET:test-only-secret-key-for-junit-do-not-use-in-production-0123456789}
  expiration: 3600000
