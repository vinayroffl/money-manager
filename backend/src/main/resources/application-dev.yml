spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/money_manager}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driverClassName: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    # Legacy dev databases created by Hibernate are baselined at V1.
    # Empty databases run every migration from V1.
    baseline-on-migrate: true
    baseline-version: 1
